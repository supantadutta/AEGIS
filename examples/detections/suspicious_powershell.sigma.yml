title: Suspicious PowerShell Execution
status: experimental
description: Encoded, hidden, or download-cradle PowerShell command lines.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \powershell.exe
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -nop '
    - ' -w hidden '
    - IEX
    - DownloadString
    - FromBase64String
  condition: selection
level: high
tags:
- attack.t1059.001
falsepositives:
- Admin scripts, software deployment, EDR tooling.
